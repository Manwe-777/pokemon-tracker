name: tcgdex probe
on: push
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/tcgdex_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tcgdex-scan, path: tcgdex-scan/}
